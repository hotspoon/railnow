version: '3'

tasks:
  default:
    desc: List available development commands
    cmds:
      - task --list

  dev:
    desc: Start development server with Air (hot reload)
    deps: [templ]
    cmds:
      - air

  run:
    desc: Start RailNow locally at http://localhost:8080
    deps: [templ]
    cmds:
      - go run ./cmd/server

  build:
    desc: Compile the server
    deps: [templ]
    cmds:
      - go build ./cmd/server

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  templ:
    desc: Generate Go code from templ templates
    cmds:
      - templ generate

  css:
    desc: Rebuild the Tailwind stylesheet
    cmds:
      - npx --yes @tailwindcss/cli@4.3.3 -i assets/css/input.css -o public/css/output.css --minify

  sqlc:
    desc: Generate typed Go query code from SQL queries
    cmds:
      - sqlc generate

  import:krl:
    desc: Download and import the public KRL schedule dataset into local SQLite (replaces local data)
    cmds:
      - mkdir -p .cache/krl
      - curl -fsSL https://raw.githubusercontent.com/dedewanta/scraping-krl-jabodetabek/master/commuter_line_schedule.csv -o .cache/krl/commuter_line_schedule.csv
      - curl -fsSL https://raw.githubusercontent.com/dedewanta/scraping-krl-jabodetabek/master/dim_station.csv -o .cache/krl/dim_station.csv
      - go run ./cmd/importer --input .cache/krl/commuter_line_schedule.csv --replace

  refresh:schedules:
    desc: Manually scrape published KAI Commuter CSV files then atomically replace timetable data
    cmds:
      - go run ./cmd/scraper --out .cache/kai
      - go run ./cmd/importer --input .cache/kai/commuter_line_schedule.csv --stations .cache/kai/dim_station.csv --replace

  migrate-up:
    desc: Apply SQLite migrations manually
    cmds:
      - goose -dir db/migrations sqlite3 data/railnow.db up

  migrate:turso:
    desc: Copy local SQLite data to TURSO_DATABASE_URL (requires TURSO_AUTH_TOKEN)
    cmds:
      - go run ./cmd/migrate-turso
