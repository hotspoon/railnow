root = "."
tmp_dir = "tmp"

[build]
  cmd = "templ generate && GOCACHE=$PWD/tmp/gocache go build -o ./tmp/railnow ./cmd/server"
  bin = "./tmp/railnow"
  include_ext = ["go", "templ"]
  exclude_dir = [".cache", "assets", "data", "public", "tmp", "vendor"]
  exclude_regex = ["_templ.go$"]
  delay = 500
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
